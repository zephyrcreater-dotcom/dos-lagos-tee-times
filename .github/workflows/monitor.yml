name: Dos Lagos Tee Time Monitor

on:
  schedule:
    # Every 5 minutes, all day. GitHub's own docs say scheduled workflows are NOT
    # guaranteed to fire at the exact minute (they can be delayed, and under high
    # GitHub-wide load some scheduled runs can be skipped entirely) — 5 minutes is
    # also the shortest interval GitHub Actions cron supports. In practice this means
    # "checked recently", not "checked at :00/:05/:10 on the dot".
    - cron: "*/5 * * * *"

  # Lets you click "Run workflow" in the GitHub UI to test on demand.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print matches, do not email or commit state)"
        type: boolean
        default: false
      date:
        description: "Check one specific date (YYYY-MM-DD) instead of the configured days/days_ahead window"
        type: string
        default: ""

permissions:
  contents: write  # needed to commit the updated state.json back to the repo

concurrency:
  group: dos-lagos-tee-time-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure config.json exists
        run: |
          if [ ! -f config.json ]; then
            cp config.example.json config.json
            echo "No config.json committed; using config.example.json defaults."
          fi

      - name: Run monitor
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python -m src.monitor $ARGS

      - name: Commit updated state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json 2>/dev/null)" ]; then
            git config user.name "dos-lagos-tee-time-monitor"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update tee time state [skip ci]"
            git push
          else
            echo "No state.json changes to commit."
          fi
